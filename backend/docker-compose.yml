# Database only, for local development:  docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: medilens
      POSTGRES_PASSWORD: medilens
      POSTGRES_DB: medilens
    ports:
      - "5432:5432"
    volumes:
      - medilens_pg:/var/lib/postgresql/data
volumes:
  medilens_pg:
